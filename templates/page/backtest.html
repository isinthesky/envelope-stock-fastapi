{% extends "layouts/base.html" %}

{% block title %}Backtest - Stock API Admin{% endblock %}

{% block content %}
<h1>Backtest</h1>
<p>백테스팅 실행 및 결과 조회</p>

<section>
  <h2>백테스트 설정</h2>
  <textarea id="backtest_json">{
  "symbol": "005930",
  "start_date": "2024-01-01",
  "end_date": "2024-06-30",
  "strategy_config": {"type": "mean_reversion"},
  "backtest_config": {"initial_cash": 1000000}
}</textarea>
  <div class="row">
    <button onclick="runBacktest()">단일 종목 실행</button>
    <button onclick="runMultiBacktest()" class="secondary">다중 종목 실행</button>
  </div>
  <div class="row" style="margin-top: 8px; align-items: center;">
    <label style="font-size:12px;">스캔 결과 사용:</label>
    
    <label style="font-size:12px; margin-left: 8px;"><input id="filter_top_only" type="checkbox" checked /> GC: OPTIMAL_BUY만 / MA5: BREAKOUT만</label>
    <button onclick="runMultiFromSavedScan('gc')" class="secondary">GC 스캔결과로 다중 백테스트</button>
    <button onclick="runMultiFromSavedScan('ma5')" class="secondary">MA5 스캔결과로 다중 백테스트</button>
  </div>
  <pre id="backtest_output">결과 출력</pre>
</section>
{% endblock %}

{% block extra_script_tags %}
<script src="/static/js/pages/backtest.js"></script>
{% endblock %}
