<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Stock API Admin{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f1f5f9; }
    .layout { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar { width: 200px; background: #1e293b; color: #e2e8f0; padding: 16px 0; position: fixed; height: 100vh; }
    .sidebar h2 { padding: 0 16px 16px; font-size: 18px; border-bottom: 1px solid #334155; }
    .sidebar h2 a { color: #e2e8f0; text-decoration: none; }
    .sidebar ul { list-style: none; margin-top: 8px; }
    .sidebar li a { display: block; padding: 10px 16px; color: #94a3b8; text-decoration: none; font-size: 14px; }
    .sidebar li a:hover { background: #334155; color: #fff; }
    .sidebar li a.active { background: #3b82f6; color: #fff; }
    .sidebar .section-title { padding: 12px 16px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; }

    /* Content */
    .content { flex: 1; margin-left: 200px; padding: 24px; }
    .content h1 { margin-bottom: 8px; color: #1e293b; }
    .content > p { color: #64748b; margin-bottom: 24px; }

    /* Section */
    section { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    section h2 { font-size: 16px; margin-bottom: 12px; color: #334155; }

    /* Form elements */
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
    label { font-weight: 600; font-size: 13px; color: #475569; min-width: 80px; }
    input, select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; width: 180px; }
    input:focus, select:focus { outline: none; border-color: #3b82f6; }
    textarea { width: 100%; min-height: 150px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; resize: vertical; }

    /* Buttons */
    button { padding: 8px 16px; background: #3b82f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    button:hover { background: #2563eb; }
    button.secondary { background: #64748b; }
    button.secondary:hover { background: #475569; }

    /* Output */
    pre { background: #0f172a; color: #e2e8f0; padding: 16px; border-radius: 6px; max-height: 400px; overflow: auto; font-size: 12px; line-height: 1.5; margin-top: 12px; }

    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <h2><a href="/page/">Stock API</a></h2>
      <ul>
        <li><a href="/page/" class="{% if active_page == 'index' %}active{% endif %}">Dashboard</a></li>
        <li><a href="/page/auth/" class="{% if active_page == 'auth' %}active{% endif %}">Auth</a></li>
        <li><a href="/page/account/" class="{% if active_page == 'account' %}active{% endif %}">Account</a></li>
        <li><a href="/page/market-data/" class="{% if active_page == 'market_data' %}active{% endif %}">Market Data</a></li>
        <li><a href="/page/order/" class="{% if active_page == 'order' %}active{% endif %}">Order</a></li>
        <li class="section-title">Data</li>
        <li><a href="/page/ohlcv/" class="{% if active_page == 'ohlcv' %}active{% endif %}">OHLCV Cache</a></li>
        <li class="section-title">Strategy</li>
        <li><a href="/page/strategy/" class="{% if active_page == 'strategy' %}active{% endif %}">Buy Strategy</a></li>
        <li><a href="/page/sell-strategy/" class="{% if active_page == 'sell_strategy' %}active{% endif %}">Sell Strategy</a></li>
        <li><a href="/page/backtest/" class="{% if active_page == 'backtest' %}active{% endif %}">Backtest</a></li>
        <li><a href="/page/websocket/" class="{% if active_page == 'websocket' %}active{% endif %}">WebSocket</a></li>
      </ul>
    </nav>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script>
    const parseJson = (text) => {
      try { return JSON.parse(text); } catch (e) { return text; }
    };

    async function request(method, url, body, outputId) {
      const opts = { method, headers: { "Content-Type": "application/json" } };
      if (body && (method === "POST" || method === "PATCH" || method === "DELETE")) {
        opts.body = JSON.stringify(body);
      }
      try {
        const res = await fetch(url, opts);
        const raw = await res.text();
        const data = parseJson(raw);
        if (outputId) {
          document.getElementById(outputId).textContent = JSON.stringify(data, null, 2);
        }
        return data;
      } catch (e) {
        if (outputId) {
          document.getElementById(outputId).textContent = 'Error: ' + e.message;
        }
        throw e;
      }
    }

    const getJson = (url, outputId) => request("GET", url, null, outputId);
    const postJson = (url, body, outputId) => request("POST", url, body, outputId);
    const patchJson = (url, body, outputId) => request("PATCH", url, body, outputId);
    const deleteJson = (url, outputId) => request("DELETE", url, null, outputId);

    {% block extra_scripts %}{% endblock %}
  </script>
</body>
</html>
