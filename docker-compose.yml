name: kis-strategy-alert-server

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kis-strategy-alert-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kis_trading}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kis_user} -d ${POSTGRES_DB:-kis_trading}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kis-strategy-alert-redis
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - kis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kis-strategy-alert-server
    environment:
      # Database (컨테이너 내부 네트워크)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kis_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kis_trading}
      # Redis
      REDIS_URL: redis://${REDIS_PASSWORD:+:$REDIS_PASSWORD@}redis:6379/0
      # App settings
      ENV: ${ENV:-development}
      DEBUG: ${DEBUG:-false}
      HOST: 0.0.0.0
      PORT: "8000"
    ports:
      - "${API_PORT:-10131}:8000"
    volumes:
      - kis_token_cache:/root/KIS/config  # KIS API 토큰 캐시 (1일 1회 발급 원칙 유지)
    networks:
      - kis-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    env_file:
      - .env

  # Test-only image. It contains dev dependencies and the test suite, unlike api.
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kis_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kis_trading}
      REDIS_URL: redis://${REDIS_PASSWORD:+:$REDIS_PASSWORD@}redis:6379/0
      # Settings currently accepts development/staging/production only.
      ENV: development
      DEBUG: "false"
    networks:
      - kis-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["test"]

networks:
  kis-network:
    name: kis-strategy-alert-server_kis-network
    driver: bridge

volumes:
  postgres_data:
    name: kis-strategy-alert-server_postgres_data
  redis_data:
    name: kis-strategy-alert-server_redis_data
  kis_token_cache:
    name: kis-strategy-alert-server_kis_token_cache
